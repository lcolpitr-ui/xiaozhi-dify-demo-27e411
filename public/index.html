<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f7f9"><meta name="description" content="购物与售后问题，和小知聊一聊。"><title>小知 · 智能客服</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><div class="layout">
<aside><a class="brand" href="/" aria-label="小知首页"><span class="brand-icon">知</span><span>小知<span class="brand-sub">CUSTOMER CARE</span></span></a><button class="new-chat" id="new-chat"><span>＋</span> 新建对话 <kbd>NEW</kbd></button><div class="side-label">为你解答</div><div class="side-topics"><span>◷　订单与物流</span><span>↩　退换货与退款</span><span>◇　商品与购物规则</span></div><div class="side-note"><span class="tiny-star">✦</span><p>让每一个问题，<br>都得到认真回应。</p><small>智能客服体验版</small></div><div class="side-bottom"><span class="avatar mini">知</span><span>小知客服助手<small>由 AI 与知识库提供支持</small></span></div></aside>
<main><header><div><span class="header-title">智能客服</span><span class="demo-badge">体验版</span></div><button class="mobile-new" id="mobile-new" aria-label="新建对话">＋</button><div class="service-status" id="status"><i></i><span>正在连接</span></div></header>
<section class="conversation" id="conversation" aria-label="客服对话"><div class="welcome" id="welcome"><div class="welcome-mark">✦</div><div class="eyebrow">YOUR EVERYDAY SUPPORT</div><h1>你好，有什么可以帮你？</h1><p>关于购物、物流或售后的疑问，<br class="mobile-break">都可以从这里开始。</p><div class="suggestions"><button data-query="退货流程是什么？"><span class="card-icon">↩</span><strong>退货怎么操作？</strong><small>了解申请步骤与注意事项</small><b>↗</b></button><button data-query="退货运费由谁承担？"><span class="card-icon">▱</span><strong>退货运费谁承担？</strong><small>查看不同情形的运费规则</small><b>↗</b></button><button data-query="如何修改收货地址？"><span class="card-icon">⌖</span><strong>可以修改地址吗？</strong><small>了解发货前后的处理方式</small><b>↗</b></button></div><div class="welcome-tip"><span>◌</span> 你也可以直接描述遇到的问题，我会尽力帮你查找答案。</div></div><div id="messages" role="log" aria-live="polite" aria-label="聊天消息"></div></section>
<div class="composer-area"><form id="chat-form"><label class="sr-only" for="query">输入你的问题</label><textarea id="query" rows="1" maxlength="1200" placeholder="说说你遇到的问题…"></textarea><div class="composer-bottom"><span id="input-hint">Enter 发送 · Shift + Enter 换行</span><button id="send" type="submit" aria-label="发送消息" disabled>↑</button></div></form><p class="disclaimer">AI 回答仅供参考，具体订单和售后结果以实际页面为准。<span>暂不支持代办订单或直接转接人工。</span></p></div>
</main></div><div id="toast" role="status"></div></body></html>
